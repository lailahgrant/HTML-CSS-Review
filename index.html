<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Crash Course</title>
</head>
<body>
    <h1>HTML Forms</h1>
    <form>
        <label for="username">Enter Username</label>
        <input type="text" id="username"  placeholder="Enter your username">
        <br> <br>
        <label for="email">Enter an Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
        <br> <br>
        <label for="password">Enter your password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <br><br>

        <p>Select your Gender</p> 
        <input type="radio" name="gender" value="male"> Male <br>
        <input type="radio" name="gender" value="female">Female <br>

        <p>Enter your age</p>
        <input type="radio" name="age" value="0-18" id="option-1">
        <label for="option-1">0-18</label>
        <input type="radio" name="age" value="19-25" id="option-2">
        <label for="option-2">19-25</label>
        <input type="radio" name="age" value="26-40" id="option-3">
        <label for="option-3">26-40</label>
        <input type="radio" name="age" value="41-60" id="option-4">
        <label for="option-4">41-60</label>
        <input type="radio" name="age" value="61+" id="option-5">
        <label for="option-5">61+</label>
        <br><br>

        <label for="">Security questions</label>
        <select name="question" id="question">
            <option value="q1">What is your mother's maiden name?</option>
            <option value="q2">What was the name of your first pet?</option>
            <option value="q3">In which city were you born?</option>
        </select>

        <br><br>

        <label for="answer">Security question Answer</label>
        <input type="text" id="answer" name="answer">

        <br><br>

        <label for="bio">Enter your bio</label>
        <textarea name="bio" id="bio" rows="10" cols="50" placeholder="My name is ...."></textarea>

        <br><br>

        <input type="submit" value="Submit">

    </form>
</body>
</html>
